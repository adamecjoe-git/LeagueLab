name: LeagueLab Roster Alerts

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - test
          - live

      season:
        description: "Fantasy season"
        required: true
        default: "2026"

      week:
        description: "Fantasy week"
        required: true
        default: "1"

      only_team:
        description: "Limit preview/test to one team"
        required: false
        default: "Hawk Tua Taco Viola"

      handoff_test:
        description: "Dry-run saved-plan handoff (no Yahoo, email, or SMS)"
        required: true
        default: false
        type: boolean

      test_now:
        description: "Simulated Central time for handoff test (ISO 8601)"
        required: false
        default: ""

  schedule:
    # Lightweight watcher. It does NOT query nflverse unless a checkpoint
    # from the morning plan is actually due.
    - cron: "*/10 * * 1,9-12 *"

env:
  TZ: America/Chicago

permissions:
  contents: read
  actions: read

concurrency:
  group: leaguelab-roster-alerts
  cancel-in-progress: false

jobs:
  roster-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Determine whether an alert checkpoint is due
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MODE: ${{ inputs.mode }}
          MANUAL_SEASON: ${{ inputs.season }}
          MANUAL_WEEK: ${{ inputs.week }}
          MANUAL_ONLY_TEAM: ${{ inputs.only_team }}
          HANDOFF_TEST: ${{ inputs.handoff_test }}
          TEST_NOW: ${{ inputs.test_now }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import io
          import json
          import os
          import urllib.request
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          github_output = Path(os.environ["GITHUB_OUTPUT"])

          def emit(name, value):
              with github_output.open("a", encoding="utf-8") as f:
                  f.write("{}={}\n".format(name, value))

          event_name = os.environ.get("EVENT_NAME", "")

          handoff_test = os.environ.get("HANDOFF_TEST", "false").lower() == "true"
          test_now_text = os.environ.get("TEST_NOW", "").strip()

          if event_name == "workflow_dispatch" and not handoff_test:
              mode = os.environ.get("MANUAL_MODE", "preview")
              season = os.environ.get("MANUAL_SEASON", "2026")
              week = os.environ.get("MANUAL_WEEK", "1")
              only_team = os.environ.get("MANUAL_ONLY_TEAM", "")

              emit("due", "true")
              emit("mode", mode)
              emit("season", season)
              emit("week", week)
              emit("only_team", only_team)
              emit("checkpoint", "manual")

              print("Manual workflow run.")
              print("Mode:", mode)
              print("Season:", season)
              print("Week:", week)
              print("Only team:", only_team or "(none)")
              raise SystemExit(0)

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          artifact_name = "leaguelab-daily-alert-plan"

          url = (
              "https://api.github.com/repos/{}/actions/artifacts"
              "?name={}&per_page=100"
          ).format(repo, artifact_name)

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer {}".format(token),
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.load(response)
          except Exception as exc:
              raise SystemExit(
                  "Could not retrieve today's LeagueLab plan artifact: {}".format(exc)
              )

          artifacts = [
              item
              for item in payload.get("artifacts", [])
              if not item.get("expired")
          ]

          if not artifacts:
              raise SystemExit(
                  "No daily LeagueLab plan artifact exists. "
                  "The morning planner may have failed."
              )

          latest = max(
              artifacts,
              key=lambda item: item.get("created_at", ""),
          )

          download_request = urllib.request.Request(
              latest["archive_download_url"],
              headers={
                  "Authorization": "Bearer {}".format(token),
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(download_request, timeout=20) as response:
              archive_bytes = response.read()

          with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
              names = archive.namelist()
              plan_names = [name for name in names if name.endswith("plan.json")]
              if not plan_names:
                  raise SystemExit("Daily plan artifact does not contain plan.json.")
              plan = json.loads(
                  archive.read(plan_names[0]).decode("utf-8")
              )

          if handoff_test:
              if not test_now_text:
                  raise SystemExit(
                      "handoff_test requires test_now, for example "
                      "2026-09-17T18:30:00-05:00"
                  )
              simulated_now = datetime.fromisoformat(test_now_text)
              if simulated_now.tzinfo is None:
                  raise SystemExit("test_now must include a UTC offset.")
              today = simulated_now.date().isoformat()
          else:
              # Workflow TZ is America/Chicago.
              today = datetime.now().astimezone().date().isoformat()

          if plan.get("date") != today:
              raise SystemExit(
                  "Daily plan is stale. Expected {}, found {}. "
                  "The morning planner may have failed.".format(
                      today,
                      plan.get("date"),
                  )
              )

          season = plan.get("season")
          week = plan.get("week")
          checkpoints = plan.get("checkpoints") or []

          if season is None or week is None or not checkpoints:
              emit("due", "false")
              emit("mode", "live")
              emit("season", season or "")
              emit("week", week or "")
              emit("only_team", "")
              emit("checkpoint", "")
              print("Today's saved plan has no NFL alert checkpoints.")
              raise SystemExit(0)

          if handoff_test:
              now = datetime.fromisoformat(test_now_text).astimezone(timezone.utc)
              print("HANDOFF TEST: using simulated time", test_now_text)
          else:
              now = datetime.now(timezone.utc)
          due_rows = []

          print("Saved plan date:", plan.get("date"))
          print("Season:", season)
          print("Week:", week)
          print("Current UTC:", now.isoformat())

          for checkpoint in checkpoints:
              run_at_text = checkpoint.get("run_at")
              kickoffs = checkpoint.get("kickoffs") or []
              if not run_at_text or not kickoffs:
                  continue

              try:
                  run_at = datetime.fromisoformat(
                      run_at_text
                  ).astimezone(timezone.utc)
              except Exception:
                  continue

              kickoff_times = []
              for row in kickoffs:
                  kickoff_text = row.get("kickoff_at")
                  if not kickoff_text:
                      continue
                  try:
                      kickoff_times.append(
                          datetime.fromisoformat(
                              kickoff_text
                          ).astimezone(timezone.utc)
                      )
                  except Exception:
                      pass

              if not kickoff_times:
                  continue

              earliest_kickoff = min(kickoff_times)
              minutes_before = kickoffs[0].get("minutes_before")

              print(
                  "Checkpoint:",
                  run_at.isoformat(),
                  "kickoff:",
                  earliest_kickoff.isoformat(),
                  "minutes_before:",
                  minutes_before,
              )

              # The 10-minute watcher may arrive late. A checkpoint remains
              # eligible until its associated kickoff.
              if run_at <= now < earliest_kickoff:
                  due_rows.append(
                      {
                          "run_at": run_at,
                          "kickoff": earliest_kickoff,
                          "minutes_before": minutes_before,
                      }
                  )

          if not due_rows:
              emit("due", "false")
              emit("mode", "live")
              emit("season", season)
              emit("week", week)
              emit("only_team", "")
              emit("checkpoint", "")
              print("No saved LeagueLab checkpoint is currently due.")
              raise SystemExit(0)

          selected = max(due_rows, key=lambda row: row["run_at"])

          emit("due", "true")
          emit("mode", "live")
          emit("season", season)
          emit("week", week)
          emit("only_team", "")
          emit("checkpoint", selected["minutes_before"])

          print("Saved checkpoint is due.")
          print("Checkpoint:", selected["minutes_before"], "minutes")
          print("Scheduled:", selected["run_at"].isoformat())
          print("Morning kickoff:", selected["kickoff"].isoformat())
          PY

      # Everything below this point runs only for a manual run or when the
      # saved morning plan says a checkpoint is due.

      - name: Rebuild private LeagueLab configuration
        if: steps.plan.outputs.due == 'true'
        env:
          MANAGERS_JSON: ${{ secrets.LEAGUELAB_MANAGERS_JSON }}
          NOTIFICATIONS_JSON: ${{ secrets.LEAGUELAB_NOTIFICATIONS_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          config_dir = Path("data/config")
          config_dir.mkdir(parents=True, exist_ok=True)

          (config_dir / "managers.json").write_text(
              os.environ["MANAGERS_JSON"],
              encoding="utf-8",
          )
          (config_dir / "notifications.json").write_text(
              os.environ["NOTIFICATIONS_JSON"],
              encoding="utf-8",
          )
          print("Private LeagueLab configuration restored.")
          PY

      - name: Install dependencies
        if: steps.plan.outputs.due == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Recheck live NFL schedule
        id: recheck
        if: >
          steps.plan.outputs.due == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.handoff_test == true)
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          PLANNED_SEASON: ${{ steps.plan.outputs.season }}
          PLANNED_WEEK: ${{ steps.plan.outputs.week }}
          PLANNED_CHECKPOINT: ${{ steps.plan.outputs.checkpoint }}
          HANDOFF_TEST: ${{ inputs.handoff_test }}
          TEST_NOW: ${{ inputs.test_now }}
        run: |
          if [ "$HANDOFF_TEST" = "true" ]; then
            TODAY="${TEST_NOW%%T*}"
          else
            TODAY="$(date +%F)"
          fi

          set +e
          python -m leaguelab.dynamic_alert_scheduler \
            --date "$TODAY" \
            --include-past \
            --json \
            > /tmp/live-plan.json
          RC=$?
          set -e

          if [ "$RC" -ne 0 ]; then
            echo "WARNING: live schedule recheck failed."
            echo "Using the morning plan as the safe fallback."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          plan = json.loads(
              Path("/tmp/live-plan.json").read_text(encoding="utf-8")
          )

          expected_season = int(os.environ["PLANNED_SEASON"])
          expected_week = int(os.environ["PLANNED_WEEK"])
          expected_checkpoint = int(os.environ["PLANNED_CHECKPOINT"])
          test_now_text = os.environ.get("TEST_NOW", "").strip()
          handoff_test = os.environ.get("HANDOFF_TEST", "false").lower() == "true"
          if handoff_test:
              now = datetime.fromisoformat(test_now_text).astimezone(timezone.utc)
              print("HANDOFF TEST live recheck time:", test_now_text)
          else:
              now = datetime.now(timezone.utc)

          if (
              int(plan.get("season") or -1) != expected_season
              or int(plan.get("week") or -1) != expected_week
          ):
              raise SystemExit(
                  "Live schedule returned an unexpected season/week."
              )

          due = False
          next_time = None

          for checkpoint in plan.get("checkpoints") or []:
              kickoffs = checkpoint.get("kickoffs") or []
              if not kickoffs:
                  continue

              minutes_before = int(kickoffs[0].get("minutes_before"))
              if minutes_before != expected_checkpoint:
                  continue

              run_at = datetime.fromisoformat(
                  checkpoint["run_at"]
              ).astimezone(timezone.utc)

              kickoff_times = [
                  datetime.fromisoformat(row["kickoff_at"]).astimezone(timezone.utc)
                  for row in kickoffs
                  if row.get("kickoff_at")
              ]
              if not kickoff_times:
                  continue

              kickoff = min(kickoff_times)

              if run_at <= now < kickoff:
                  due = True
                  break

              if run_at > now and (next_time is None or run_at < next_time):
                  next_time = run_at

          output = Path(os.environ["GITHUB_OUTPUT"])

          with output.open("a", encoding="utf-8") as f:
              f.write("proceed={}\n".format("true" if due else "false"))

          if due:
              print("Live schedule confirms this checkpoint is due.")
          else:
              print("Live schedule says this checkpoint is not due now.")
              if next_time is not None:
                  print("Updated checkpoint time:", next_time.isoformat())
                  print(
                      "The lightweight watcher will pick it up on a later run."
                  )
          PY

      - name: Decide whether alert engine should proceed
        id: proceed
        if: steps.plan.outputs.due == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          RECHECK_PROCEED: ${{ steps.recheck.outputs.proceed }}
          HANDOFF_TEST: ${{ inputs.handoff_test }}
        run: |
          if [ "$HANDOFF_TEST" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Dry-run handoff test: stopping before Yahoo/notifications."
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$RECHECK_PROCEED" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Handoff dry-run result
        if: inputs.handoff_test == true
        run: |
          echo "Saved-plan due: ${{ steps.plan.outputs.due }}"
          echo "Checkpoint: ${{ steps.plan.outputs.checkpoint }}"
          echo "Live recheck proceed: ${{ steps.recheck.outputs.proceed }}"
          echo "Alert engine run: ${{ steps.proceed.outputs.run }}"
          echo "No Yahoo refresh, email, or SMS was executed."

      - name: Install Playwright Chromium
        if: steps.proceed.outputs.run == 'true'
        run: |
          python -m playwright install --with-deps chromium

      - name: Decrypt Yahoo authentication state
        if: steps.proceed.outputs.run == 'true'
        env:
          YAHOO_STORAGE_PASSPHRASE: ${{ secrets.YAHOO_STORAGE_PASSPHRASE }}
        run: |
          openssl enc \
            -d \
            -aes-256-cbc \
            -pbkdf2 \
            -iter 200000 \
            -in yahoo-storage-state.json.enc \
            -out .yahoo-storage-state.json \
            -pass env:YAHOO_STORAGE_PASSPHRASE

          test -s .yahoo-storage-state.json
          echo "Yahoo authentication state decrypted."

      - name: Restore production roster-alert state
        if: >
          steps.proceed.outputs.run == 'true' &&
          steps.plan.outputs.mode == 'live'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import io
          import json
          import os
          import urllib.request
          import zipfile
          from pathlib import Path

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          artifact_name = "leaguelab-roster-alert-state"

          url = (
              "https://api.github.com/repos/{}/actions/artifacts"
              "?name={}&per_page=100"
          ).format(repo, artifact_name)

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer {}".format(token),
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.load(response)
          except Exception as exc:
              print("Could not query previous alert state:", exc)
              print("Continuing with no prior state.")
              raise SystemExit(0)

          artifacts = [
              item
              for item in payload.get("artifacts", [])
              if not item.get("expired")
          ]

          if not artifacts:
              print("No previous roster-alert state artifact found.")
              raise SystemExit(0)

          latest = max(
              artifacts,
              key=lambda item: item.get("created_at", ""),
          )

          download_request = urllib.request.Request(
              latest["archive_download_url"],
              headers={
                  "Authorization": "Bearer {}".format(token),
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(download_request, timeout=20) as response:
              archive_bytes = response.read()

          destination = Path("data/state/roster_alerts")
          destination.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
              archive.extractall(destination)

          restored = list(destination.rglob("*.json"))
          print("Restored {} state file(s).".format(len(restored)))
          PY

      - name: Bootstrap Yahoo league metadata
        if: steps.proceed.outputs.run == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from leaguelab.yahoo.client import YahooFantasyClient

          season = int("${{ steps.plan.outputs.season }}")
          root = Path("data") / "raw" / "yahoo" / str(season)
          root.mkdir(parents=True, exist_ok=True)

          with YahooFantasyClient() as client:
              leagues = client.get_leagues(season)
              league_keys = []

              def walk(value):
                  if isinstance(value, dict):
                      for key, item in value.items():
                          if (
                              key == "league_key"
                              and isinstance(item, str)
                              and ".l." in item
                          ):
                              league_keys.append(item)
                          walk(item)
                  elif isinstance(value, list):
                      for item in value:
                          walk(item)

              walk(leagues)
              league_keys = sorted(set(league_keys))

              if len(league_keys) != 1:
                  raise RuntimeError(
                      "Expected exactly one Yahoo NFL league for {}; found: {}".format(
                          season,
                          league_keys,
                      )
                  )

              league_key = league_keys[0]
              print("Yahoo league:", league_key)
              teams = client.get_teams(league_key)

          league_dir = root / league_key
          league_dir.mkdir(parents=True, exist_ok=True)

          teams_path = league_dir / "teams.json"
          teams_path.write_text(
              json.dumps(teams, indent=2),
              encoding="utf-8",
          )
          print("Wrote Yahoo team metadata:", teams_path)
          PY

      - name: Run LeagueLab live preflight
        if: steps.proceed.outputs.run == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          LEAGUELAB_EMAIL_ADDRESS: ${{ secrets.LEAGUELAB_EMAIL_ADDRESS }}
          LEAGUELAB_EMAIL_APP_PASSWORD: ${{ secrets.LEAGUELAB_EMAIL_APP_PASSWORD }}
          LEAGUELAB_TEXTBELT_API_KEY: ${{ secrets.LEAGUELAB_TEXTBELT_API_KEY }}
        run: |
          python -m leaguelab.live_preflight \
            --season "${{ steps.plan.outputs.season }}" \
            --week "${{ steps.plan.outputs.week }}"

      - name: Run roster alert engine
        if: steps.proceed.outputs.run == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          LEAGUELAB_EMAIL_ADDRESS: ${{ secrets.LEAGUELAB_EMAIL_ADDRESS }}
          LEAGUELAB_EMAIL_APP_PASSWORD: ${{ secrets.LEAGUELAB_EMAIL_APP_PASSWORD }}
          LEAGUELAB_TEXTBELT_API_KEY: ${{ secrets.LEAGUELAB_TEXTBELT_API_KEY }}
          RUN_MODE: ${{ steps.plan.outputs.mode }}
          RUN_SEASON: ${{ steps.plan.outputs.season }}
          RUN_WEEK: ${{ steps.plan.outputs.week }}
          ONLY_TEAM: ${{ steps.plan.outputs.only_team }}
        run: |
          echo "Mode: $RUN_MODE"
          echo "Season: $RUN_SEASON"
          echo "Week: $RUN_WEEK"

          if [ "$RUN_MODE" = "live" ]; then
            python -m leaguelab.roster_alert_runner \
              --season "$RUN_SEASON" \
              --week "$RUN_WEEK" \
              --mode live \
              --refresh-schedule \
              --refresh-yahoo

          elif [ -n "$ONLY_TEAM" ]; then
            python -m leaguelab.roster_alert_runner \
              --season "$RUN_SEASON" \
              --week "$RUN_WEEK" \
              --mode "$RUN_MODE" \
              --only-team "$ONLY_TEAM" \
              --refresh-schedule \
              --refresh-yahoo

          else
            python -m leaguelab.roster_alert_runner \
              --season "$RUN_SEASON" \
              --week "$RUN_WEEK" \
              --mode "$RUN_MODE" \
              --refresh-schedule \
              --refresh-yahoo
          fi

      - name: Save production roster-alert state
        if: >
          always() &&
          steps.proceed.outputs.run == 'true' &&
          steps.plan.outputs.mode == 'live'
        uses: actions/upload-artifact@v4
        with:
          name: leaguelab-roster-alert-state
          path: data/state/roster_alerts/
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true
