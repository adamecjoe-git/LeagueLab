name: LeagueLab Roster Alerts

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - test
          - live

      season:
        description: "Fantasy season"
        required: true
        default: "2026"

      week:
        description: "Fantasy week"
        required: true
        default: "1"

      only_team:
        description: "Limit preview/test to one team"
        required: false
        default: "Hawk Tua Taco Viola"

  schedule:
    # Thursday evening / early Friday UTC
    - cron: "*/10 22-23 * 9-12 4"
    - cron: "*/10 0-4 * 9-12 5"

    # Friday special-game window
    - cron: "*/10 17-23 * 11-12 5"

    # Saturday special-game window
    - cron: "*/10 17-23 * 12,1 6"
    - cron: "*/10 0-4 * 12,1 0"

    # Sunday NFL window, including early international games
    - cron: "*/10 12-23 * 9-12 0"
    - cron: "*/10 0-4 * 9-12 1"

    # Monday Night Football
    - cron: "*/10 22-23 * 9-12 1"
    - cron: "*/10 0-4 * 9-12 2"

permissions:
  contents: read
  actions: read

concurrency:
  group: leaguelab-roster-alerts
  cancel-in-progress: false

jobs:
  roster-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      # The dynamic scheduler reads notifications.json, so private config
      # must exist before the planning step runs.
      - name: Rebuild private LeagueLab configuration
        env:
          MANAGERS_JSON: ${{ secrets.LEAGUELAB_MANAGERS_JSON }}
          NOTIFICATIONS_JSON: ${{ secrets.LEAGUELAB_NOTIFICATIONS_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          config_dir = Path("data/config")
          config_dir.mkdir(parents=True, exist_ok=True)

          managers = os.environ["MANAGERS_JSON"]
          notifications = os.environ["NOTIFICATIONS_JSON"]

          (config_dir / "managers.json").write_text(
              managers,
              encoding="utf-8",
          )

          (config_dir / "notifications.json").write_text(
              notifications,
              encoding="utf-8",
          )

          print("Private LeagueLab configuration restored.")
          PY

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine whether an alert checkpoint is due
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MODE: ${{ inputs.mode }}
          MANUAL_SEASON: ${{ inputs.season }}
          MANUAL_WEEK: ${{ inputs.week }}
          MANUAL_ONLY_TEAM: ${{ inputs.only_team }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          github_output = Path(os.environ["GITHUB_OUTPUT"])

          def emit(name, value):
              with github_output.open("a", encoding="utf-8") as f:
                  f.write(f"{name}={value}\n")

          event_name = os.environ.get("EVENT_NAME", "")

          # ----------------------------------------------------------
          # Manual run
          # ----------------------------------------------------------
          if event_name == "workflow_dispatch":
              mode = os.environ.get("MANUAL_MODE", "preview")
              season = os.environ.get("MANUAL_SEASON", "2026")
              week = os.environ.get("MANUAL_WEEK", "1")
              only_team = os.environ.get("MANUAL_ONLY_TEAM", "")

              emit("due", "true")
              emit("mode", mode)
              emit("season", season)
              emit("week", week)
              emit("only_team", only_team)

              print("Manual workflow run.")
              print(f"Mode: {mode}")
              print(f"Season: {season}")
              print(f"Week: {week}")
              print(f"Only team: {only_team or '(none)'}")

              raise SystemExit(0)

          # ----------------------------------------------------------
          # Scheduled run
          # ----------------------------------------------------------
          cmd = [
              sys.executable,
              "-m",
              "leaguelab.dynamic_alert_scheduler",
              "--include-past",
              "--json",
          ]

          print("Running dynamic scheduler:")
          print(" ".join(cmd))

          proc = subprocess.run(
              cmd,
              capture_output=True,
              text=True,
          )

          if proc.stdout:
              print()
              print("----- Scheduler stdout -----")
              print(proc.stdout)
              print("----- End scheduler stdout -----")

          if proc.stderr:
              print()
              print("----- Scheduler stderr -----")
              print(proc.stderr)
              print("----- End scheduler stderr -----")

          if proc.returncode != 0:
              print()
              print(
                  "ERROR: dynamic_alert_scheduler returned "
                  f"exit code {proc.returncode}"
              )
              raise SystemExit(proc.returncode)

          try:
              payload = json.loads(proc.stdout)
          except Exception as exc:
              print()
              print("ERROR: Scheduler output was not valid JSON.")
              print(f"{type(exc).__name__}: {exc}")
              raise

          season = payload.get("season")
          week = payload.get("week")
          checkpoints = payload.get("checkpoints") or []

          now = datetime.now(timezone.utc)

          print()
          print(f"Current UTC time: {now.isoformat()}")
          print(f"Scheduler season: {season}")
          print(f"Scheduler week: {week}")
          print(f"Checkpoint groups returned: {len(checkpoints)}")

          due_rows = []

          for checkpoint in checkpoints:
              run_at_text = checkpoint.get("run_at")
              kickoffs = checkpoint.get("kickoffs") or []

              if not run_at_text or not kickoffs:
                  continue

              try:
                  run_at = datetime.fromisoformat(
                      run_at_text
                  ).astimezone(timezone.utc)
              except Exception as exc:
                  print(
                      f"Skipping invalid run_at "
                      f"{run_at_text!r}: {exc}"
                  )
                  continue

              kickoff_times = []

              for row in kickoffs:
                  kickoff_text = row.get("kickoff_at")

                  if not kickoff_text:
                      continue

                  try:
                      kickoff_times.append(
                          datetime.fromisoformat(
                              kickoff_text
                          ).astimezone(timezone.utc)
                      )
                  except Exception as exc:
                      print(
                          f"Skipping invalid kickoff "
                          f"{kickoff_text!r}: {exc}"
                      )

              if not kickoff_times:
                  continue

              earliest_kickoff = min(kickoff_times)

              minutes_before = kickoffs[0].get(
                  "minutes_before"
              )

              print(
                  "Checkpoint:",
                  f"run_at={run_at.isoformat()}",
                  f"kickoff={earliest_kickoff.isoformat()}",
                  f"minutes_before={minutes_before}",
              )

              # GitHub scheduled workflows may start a few minutes late.
              # Allow the checkpoint until the associated kickoff occurs.
              if run_at <= now < earliest_kickoff:
                  due_rows.append(
                      {
                          "run_at": run_at,
                          "kickoff": earliest_kickoff,
                          "minutes_before": minutes_before,
                      }
                  )

          # ----------------------------------------------------------
          # Nothing due
          # ----------------------------------------------------------
          if not due_rows:
              emit("due", "false")
              emit("mode", "live")
              emit("season", season or "")
              emit("week", week or "")
              emit("only_team", "")

              print()
              print(
                  "No LeagueLab roster-alert checkpoint "
                  "is currently due."
              )

              raise SystemExit(0)

          # If GitHub was delayed enough to overlap multiple checkpoints,
          # use the most recently scheduled one.
          selected = max(
              due_rows,
              key=lambda row: row["run_at"],
          )

          if season is None or week is None:
              raise SystemExit(
                  "Checkpoint is due, but season/week "
                  "could not be determined."
              )

          emit("due", "true")
          emit("mode", "live")
          emit("season", season)
          emit("week", week)
          emit("only_team", "")

          print()
          print("LeagueLab checkpoint is due.")
          print(f"Season: {season}")
          print(f"Week: {week}")
          print(
              "Checkpoint: "
              f"{selected['minutes_before']} minutes"
          )
          print(
              "Scheduled time: "
              f"{selected['run_at'].isoformat()}"
          )
          print(
              "Kickoff: "
              f"{selected['kickoff'].isoformat()}"
          )
          PY

      # Everything below here only runs when an actual alert
      # checkpoint is due or when the workflow was started manually.

      - name: Install Playwright Chromium
        if: steps.plan.outputs.due == 'true'
        run: |
          python -m playwright install --with-deps chromium

      - name: Decrypt Yahoo authentication state
        if: steps.plan.outputs.due == 'true'
        env:
          YAHOO_STORAGE_PASSPHRASE: ${{ secrets.YAHOO_STORAGE_PASSPHRASE }}
        run: |
          openssl enc \
            -d \
            -aes-256-cbc \
            -pbkdf2 \
            -iter 200000 \
            -in yahoo-storage-state.json.enc \
            -out .yahoo-storage-state.json \
            -pass env:YAHOO_STORAGE_PASSPHRASE

          test -s .yahoo-storage-state.json

          echo "Yahoo authentication state decrypted."

      - name: Restore production roster-alert state
        if: >
          steps.plan.outputs.due == 'true' &&
          steps.plan.outputs.mode == 'live'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import io
          import json
          import os
          import urllib.request
          import zipfile
          from pathlib import Path

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]

          artifact_name = "leaguelab-roster-alert-state"

          url = (
              f"https://api.github.com/repos/{repo}"
              f"/actions/artifacts"
              f"?name={artifact_name}&per_page=100"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          try:
              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)
          except Exception as exc:
              print(
                  "Could not query previous alert-state "
                  f"artifacts: {exc}"
              )
              print("Continuing with no prior state.")
              raise SystemExit(0)

          artifacts = [
              artifact
              for artifact in payload.get("artifacts", [])
              if not artifact.get("expired")
          ]

          if not artifacts:
              print("No previous roster-alert state artifact found.")
              raise SystemExit(0)

          latest = max(
              artifacts,
              key=lambda artifact: artifact.get(
                  "created_at",
                  "",
              ),
          )

          print(
              "Restoring artifact:",
              latest.get("name"),
              latest.get("created_at"),
          )

          download_url = latest["archive_download_url"]

          download_request = urllib.request.Request(
              download_url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(download_request) as response:
              archive_bytes = response.read()

          destination = Path(
              "data/state/roster_alerts"
          )

          destination.mkdir(
              parents=True,
              exist_ok=True,
          )

          with zipfile.ZipFile(
              io.BytesIO(archive_bytes)
          ) as archive:
              archive.extractall(destination)

          restored = list(
              destination.rglob("*.json")
          )

          print(
              f"Restored {len(restored)} state file(s)."
          )

          for path in restored:
              print(" ", path)
          PY

      - name: Bootstrap Yahoo league metadata
        if: steps.plan.outputs.due == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from leaguelab.yahoo.client import YahooFantasyClient

          season = int(
              "${{ steps.plan.outputs.season }}"
          )

          root = (
              Path("data")
              / "raw"
              / "yahoo"
              / str(season)
          )

          root.mkdir(
              parents=True,
              exist_ok=True,
          )

          with YahooFantasyClient() as client:
              leagues = client.get_leagues(
                  season
              )

              league_keys = []

              def walk(value):
                  if isinstance(value, dict):
                      for key, item in value.items():
                          if (
                              key == "league_key"
                              and isinstance(item, str)
                              and ".l." in item
                          ):
                              league_keys.append(
                                  item
                              )

                          walk(item)

                  elif isinstance(value, list):
                      for item in value:
                          walk(item)

              walk(leagues)

              league_keys = sorted(
                  set(league_keys)
              )

              if len(league_keys) != 1:
                  raise RuntimeError(
                      "Expected exactly one Yahoo NFL league "
                      f"for {season}; found: {league_keys}"
                  )

              league_key = league_keys[0]

              print(
                  f"Yahoo league: {league_key}"
              )

              teams = client.get_teams(
                  league_key
              )

          league_dir = root / league_key

          league_dir.mkdir(
              parents=True,
              exist_ok=True,
          )

          teams_path = (
              league_dir
              / "teams.json"
          )

          teams_path.write_text(
              json.dumps(
                  teams,
                  indent=2,
              ),
              encoding="utf-8",
          )

          print(
              f"Wrote Yahoo team metadata: {teams_path}"
          )
          PY

      - name: Run LeagueLab live preflight
        if: steps.plan.outputs.due == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          LEAGUELAB_EMAIL_ADDRESS: ${{ secrets.LEAGUELAB_EMAIL_ADDRESS }}
          LEAGUELAB_EMAIL_APP_PASSWORD: ${{ secrets.LEAGUELAB_EMAIL_APP_PASSWORD }}
          LEAGUELAB_TEXTBELT_API_KEY: ${{ secrets.LEAGUELAB_TEXTBELT_API_KEY }}
        run: |
          python -m leaguelab.live_preflight \
            --season "${{ steps.plan.outputs.season }}" \
            --week "${{ steps.plan.outputs.week }}"

      - name: Run roster alert engine
        if: steps.plan.outputs.due == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          LEAGUELAB_EMAIL_ADDRESS: ${{ secrets.LEAGUELAB_EMAIL_ADDRESS }}
          LEAGUELAB_EMAIL_APP_PASSWORD: ${{ secrets.LEAGUELAB_EMAIL_APP_PASSWORD }}
          LEAGUELAB_TEXTBELT_API_KEY: ${{ secrets.LEAGUELAB_TEXTBELT_API_KEY }}
          RUN_MODE: ${{ steps.plan.outputs.mode }}
          RUN_SEASON: ${{ steps.plan.outputs.season }}
          RUN_WEEK: ${{ steps.plan.outputs.week }}
          ONLY_TEAM: ${{ steps.plan.outputs.only_team }}
        run: |
          echo "Mode: $RUN_MODE"
          echo "Season: $RUN_SEASON"
          echo "Week: $RUN_WEEK"

          if [ "$RUN_MODE" = "live" ]; then
            python -m leaguelab.roster_alert_runner \
              --season "$RUN_SEASON" \
              --week "$RUN_WEEK" \
              --mode live \
              --refresh-schedule \
              --refresh-yahoo

          elif [ -n "$ONLY_TEAM" ]; then
            python -m leaguelab.roster_alert_runner \
              --season "$RUN_SEASON" \
              --week "$RUN_WEEK" \
              --mode "$RUN_MODE" \
              --only-team "$ONLY_TEAM" \
              --refresh-schedule \
              --refresh-yahoo

          else
            python -m leaguelab.roster_alert_runner \
              --season "$RUN_SEASON" \
              --week "$RUN_WEEK" \
              --mode "$RUN_MODE" \
              --refresh-schedule \
              --refresh-yahoo
          fi

      - name: Save production roster-alert state
        if: >
          always() &&
          steps.plan.outputs.due == 'true' &&
          steps.plan.outputs.mode == 'live'
        uses: actions/upload-artifact@v4
        with:
          name: leaguelab-roster-alert-state
          path: data/state/roster_alerts/
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true