name: LeagueLab Roster Alerts
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "preview"
        type: choice
        options: [preview, test, live]
      season: {description: "Fantasy season", required: true, default: "2026"}
      week: {description: "Fantasy week", required: true, default: "1"}
      only_team_key: {description: "Limit preview/test to one Yahoo team key", required: false, default: "470.l.197909.t.5"}
      scheduler_test: {description: "Scheduler-only test; no Yahoo/email/SMS", required: true, default: false, type: boolean}
      real_plan_test: {description: "Evaluate saved daily plan only; no Yahoo/email/SMS", required: true, default: false, type: boolean}
      controlled_live_test: {description: "Real Yahoo + notifications, restricted to only_team_key", required: true, default: false, type: boolean}
      test_now: {description: "ISO Central time with offset", required: false, default: ""}
      test_kickoffs: {description: "Comma-separated HH:MM kickoffs", required: false, default: ""}
      test_processed: {description: "Processed checkpoints e.g. 12:00@45", required: false, default: ""}
  schedule:
    - cron: "*/5 12-23 * 1,9-12 *"
    - cron: "*/5 0-4 * 1,9-12 *"
env:
  TZ: America/Chicago
permissions:
  contents: read
  actions: read
concurrency:
  group: leaguelab-roster-alerts
  cancel-in-progress: false
jobs:
  roster-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.8"}
      - name: Decide whether checkpoint is due
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          SEASON: ${{ inputs.season }}
          WEEK: ${{ inputs.week }}
          ONLY_TEAM_KEY: ${{ inputs.only_team_key }}
          SCHED_TEST: ${{ inputs.scheduler_test }}
          REAL_PLAN_TEST: ${{ inputs.real_plan_test }}
          CONTROLLED_LIVE_TEST: ${{ inputs.controlled_live_test }}
          TEST_NOW: ${{ inputs.test_now }}
          TEST_KICKOFFS: ${{ inputs.test_kickoffs }}
          TEST_PROCESSED: ${{ inputs.test_processed }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from datetime import datetime,timedelta
          from pathlib import Path
          O=Path(os.environ["GITHUB_OUTPUT"])
          def emit(k,v):
              with O.open("a") as f:f.write("{}={}\n".format(k,v))
          def noop(msg):
              for k,v in [("due","false"),("mode","live"),("season",""),("week",""),("only_team_key",""),("checkpoint",""),("kickoff_at","")]:emit(k,v)
              print(msg);raise SystemExit(0)
          test=os.environ.get("SCHED_TEST","false").lower()=="true"
          real_plan_test=os.environ.get("REAL_PLAN_TEST","false").lower()=="true"
          controlled_live_test=os.environ.get("CONTROLLED_LIVE_TEST","false").lower()=="true"
          if controlled_live_test:
              if not os.environ.get("TEST_NOW"): raise SystemExit("controlled_live_test requires test_now")
              if not os.environ.get("ONLY_TEAM_KEY"): raise SystemExit("controlled_live_test requires only_team_key")
              for k,v in [("due","true"),("mode","test"),("season",os.environ["SEASON"]),("week",os.environ["WEEK"]),("only_team_key",os.environ["ONLY_TEAM_KEY"]),("checkpoint","controlled"),("kickoff_at","")]:emit(k,v)
              raise SystemExit(0)
          if os.environ["EVENT"]=="workflow_dispatch" and not test and not real_plan_test:
              for k,v in [("due","true"),("mode",os.environ["MODE"]),("season",os.environ["SEASON"]),("week",os.environ["WEEK"]),("only_team_key",os.environ["ONLY_TEAM_KEY"]),("checkpoint","manual"),("kickoff_at","")]:emit(k,v)
              raise SystemExit(0)
          if test:
              if not os.environ.get("TEST_NOW"): raise SystemExit("scheduler_test requires test_now")
              now=datetime.fromisoformat(os.environ["TEST_NOW"])
              groups=[]
              for s in filter(None,[x.strip() for x in os.environ.get("TEST_KICKOFFS","").split(",")]):
                  h,m=map(int,s.split(":")); k=now.replace(hour=h,minute=m,second=0,microsecond=0)
                  groups.append({"kickoff_at":k.isoformat(),"games":[]})
              plan={"date":now.date().isoformat(),"games_today":bool(groups),"season":int(os.environ["SEASON"]),"week":int(os.environ["WEEK"]),"kickoff_groups":groups}
              processed=set()
              for s in filter(None,[x.strip() for x in os.environ.get("TEST_PROCESSED","").split(",")]):
                  clock,mins=s.split("@");h,m=map(int,clock.split(":"));k=now.replace(hour=h,minute=m,second=0,microsecond=0)
                  processed.add("{}@{}".format(k.isoformat(),mins))
          else:
              now=datetime.now().astimezone()
              if now.hour<7 or now.hour>=22: noop("Outside 7 AM-10 PM Central; successful no-op.")
              d=Path("/tmp/plan");subprocess.run(["rm","-rf",str(d)]);d.mkdir()
              r=subprocess.run(["gh","run","download","-n","leaguelab-daily-alert-plan","-D",str(d)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              if r.returncode: noop("No current plan artifact; successful no-op.")
              ms=list(d.rglob("plan.json"))
              if not ms: noop("No plan.json; successful no-op.")
              plan=json.loads(ms[0].read_text())
              if plan.get("date")!=now.date().isoformat(): noop("Stale plan; successful no-op.")
              processed=set()
              sd=Path("/tmp/sstate");subprocess.run(["rm","-rf",str(sd)]);sd.mkdir()
              r=subprocess.run(["gh","run","download","-n","leaguelab-scheduler-state","-D",str(sd)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              if r.returncode==0:
                  ms=list(sd.rglob("scheduler_state.json"))
                  if ms:
                      st=json.loads(ms[0].read_text())
                      if st.get("date")==now.date().isoformat():processed=set(st.get("processed") or [])
          if not plan.get("games_today"):noop("No NFL games today; successful no-op.")
          due=[]
          for g in plan.get("kickoff_groups",[]):
              k=datetime.fromisoformat(g["kickoff_at"]).astimezone(now.tzinfo)
              if now>=k:
                  continue
              # A checkpoint remains eligible after its nominal time instead of
              # expiring after five minutes. Once T-10 is reached it supersedes
              # a missed T-45, so a delayed Actions runner sends one useful alert
              # rather than replaying stale checkpoints.
              mins=None
              if now>=k-timedelta(minutes=10):
                  if "{}@10".format(k.isoformat()) not in processed:
                      mins=10
              elif now>=k-timedelta(minutes=45):
                  if "{}@45".format(k.isoformat()) not in processed:
                      mins=45
              if mins is not None:
                  due.append((k-timedelta(minutes=mins),k,mins))
          if not due:noop("Game day; no checkpoint due.")
          _,k,mins=min(due)
          for a,b in [("due","true"),("mode","live"),("season",plan["season"]),("week",plan["week"]),("only_team_key",""),("checkpoint",mins),("kickoff_at",k.isoformat())]:emit(a,b)
          print("DUE:",mins,"minutes before",k.isoformat())
          if test:print("SCHEDULER TEST ONLY - no Yahoo/email/SMS.")
          PY
      - name: Scheduler test result
        if: inputs.scheduler_test == true || inputs.real_plan_test == true
        run: |
          echo "Due=${{ steps.gate.outputs.due }}"
          echo "Checkpoint=${{ steps.gate.outputs.checkpoint }}"
          echo "Kickoff=${{ steps.gate.outputs.kickoff_at }}"
      - name: Restore config
        if: steps.gate.outputs.due == 'true' && inputs.scheduler_test != true && inputs.real_plan_test != true
        env:
          MANAGERS_JSON: ${{ secrets.LEAGUELAB_MANAGERS_JSON }}
          NOTIFICATIONS_JSON: ${{ secrets.LEAGUELAB_NOTIFICATIONS_JSON }}
        run: |
          mkdir -p data/config
          printf '%s' "$MANAGERS_JSON" > data/config/managers.json
          printf '%s' "$NOTIFICATIONS_JSON" > data/config/notifications.json
      - name: Install dependencies
        if: steps.gate.outputs.due == 'true' && inputs.scheduler_test != true && inputs.real_plan_test != true
        run: pip install -r requirements.txt
      - name: Recheck live NFL schedule
        id: live
        if: steps.gate.outputs.due == 'true' && inputs.scheduler_test != true && inputs.real_plan_test != true && github.event_name != 'workflow_dispatch'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          EXPECTED: ${{ steps.gate.outputs.kickoff_at }}
          CHECKPOINT: ${{ steps.gate.outputs.checkpoint }}
        run: |
          python -m leaguelab.dynamic_alert_scheduler --date "$(TZ=America/Chicago date +%F)" --json > /tmp/live.json
          python - <<'PY'
          import json,os
          from datetime import datetime,timedelta
          from pathlib import Path
          p=json.loads(Path("/tmp/live.json").read_text());e=datetime.fromisoformat(os.environ["EXPECTED"]);m=int(os.environ["CHECKPOINT"]);now=datetime.now().astimezone()
          times=sorted(datetime.fromisoformat(g["kickoff_at"]) for g in p.get("kickoff_groups",[]))
          # Games may be delayed after the morning plan. Accept the matching
          # kickoff or the next later group, then require that the selected
          # checkpoint has actually been reached and kickoff has not occurred.
          live=next((x for x in times if x>=e),None);ok=False
          if live:
              target=live-timedelta(minutes=m)
              ok=target<=now<live
          if live and live>e:print("Kickoff delayed to",live.isoformat())
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as f:
              f.write("proceed={}\n".format("true" if ok else "false"));f.write("kickoff={}\n".format(live.isoformat() if live else ""))
          PY
      - name: Decide production handoff
        id: proceed
        if: steps.gate.outputs.due == 'true' && inputs.scheduler_test != true && inputs.real_plan_test != true
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.live.outputs.proceed }}" = "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install Playwright Chromium
        if: steps.proceed.outputs.run == 'true'
        run: python -m playwright install --with-deps chromium
      - name: Decrypt Yahoo auth
        if: steps.proceed.outputs.run == 'true'
        env:
          YAHOO_STORAGE_PASSPHRASE: ${{ secrets.YAHOO_STORAGE_PASSPHRASE }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in yahoo-storage-state.json.enc -out .yahoo-storage-state.json -pass env:YAHOO_STORAGE_PASSPHRASE
      - name: Restore alert state
        if: steps.proceed.outputs.run == 'true' && steps.gate.outputs.mode == 'live'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir -p data/state/roster_alerts /tmp/rstate
          gh run download -n leaguelab-roster-alert-state -D /tmp/rstate && cp -R /tmp/rstate/. data/state/roster_alerts/ || true
      - name: Bootstrap Yahoo metadata
        if: steps.proceed.outputs.run == 'true'
        env: {PYTHONPATH: "${{ github.workspace }}/src"}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from leaguelab.yahoo.client import YahooFantasyClient
          s=int("${{ steps.gate.outputs.season }}");root=Path("data/raw/yahoo")/str(s);root.mkdir(parents=True,exist_ok=True)
          with YahooFantasyClient() as c:
              x=c.get_leagues(s);keys=[]
              def w(v):
                  if isinstance(v,dict):
                      for k,z in v.items():
                          if k=="league_key" and isinstance(z,str) and ".l." in z:keys.append(z)
                          w(z)
                  elif isinstance(v,list):
                      for z in v:w(z)
              w(x);keys=sorted(set(keys))
              if len(keys)!=1:raise RuntimeError("Expected one Yahoo NFL league; found {}".format(keys))
              lk=keys[0];teams=c.get_teams(lk)
          d=root/lk;d.mkdir(parents=True,exist_ok=True);(d/"teams.json").write_text(json.dumps(teams,indent=2))
          PY
      - name: Sync Yahoo manager identity
        if: steps.proceed.outputs.run == 'true'
        env: {PYTHONPATH: "${{ github.workspace }}/src"}
        run: python -m leaguelab.manager_config_sync --season "${{ steps.gate.outputs.season }}"
      - name: Live preflight
        if: steps.proceed.outputs.run == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          LEAGUELAB_EMAIL_ADDRESS: ${{ secrets.LEAGUELAB_EMAIL_ADDRESS }}
          LEAGUELAB_EMAIL_APP_PASSWORD: ${{ secrets.LEAGUELAB_EMAIL_APP_PASSWORD }}
          LEAGUELAB_TEXTBELT_API_KEY: ${{ secrets.LEAGUELAB_TEXTBELT_API_KEY }}
        run: python -m leaguelab.live_preflight --season "${{ steps.gate.outputs.season }}" --week "${{ steps.gate.outputs.week }}"
      - name: Run roster alert engine
        if: steps.proceed.outputs.run == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          LEAGUELAB_EMAIL_ADDRESS: ${{ secrets.LEAGUELAB_EMAIL_ADDRESS }}
          LEAGUELAB_EMAIL_APP_PASSWORD: ${{ secrets.LEAGUELAB_EMAIL_APP_PASSWORD }}
          LEAGUELAB_TEXTBELT_API_KEY: ${{ secrets.LEAGUELAB_TEXTBELT_API_KEY }}
        run: |
          ONLY_TEAM_KEY="${{ steps.gate.outputs.only_team_key }}"
          EXTRA_NOW=""
          if [ "${{ inputs.controlled_live_test }}" = "true" ]; then EXTRA_NOW="--now ${{ inputs.test_now }}"; fi
          if [ -n "$ONLY_TEAM_KEY" ] && [ "${{ steps.gate.outputs.mode }}" != "live" ]; then
            python -m leaguelab.roster_alert_runner --season "${{ steps.gate.outputs.season }}" --week "${{ steps.gate.outputs.week }}" --mode "${{ steps.gate.outputs.mode }}" --only-team-key "$ONLY_TEAM_KEY" $EXTRA_NOW --refresh-schedule --refresh-yahoo
          else
            python -m leaguelab.roster_alert_runner --season "${{ steps.gate.outputs.season }}" --week "${{ steps.gate.outputs.week }}" --mode "${{ steps.gate.outputs.mode }}" $EXTRA_NOW --refresh-schedule --refresh-yahoo
          fi
      - name: Save alert state
        if: always() && steps.proceed.outputs.run == 'true' && steps.gate.outputs.mode == 'live'
        uses: actions/upload-artifact@v4
        with:
          name: leaguelab-roster-alert-state
          path: data/state/roster_alerts/
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true
      - name: Mark scheduler checkpoint processed
        if: steps.proceed.outputs.run == 'true' && steps.gate.outputs.mode == 'live' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          KICKOFF: ${{ steps.live.outputs.kickoff || steps.gate.outputs.kickoff_at }}
          CHECKPOINT: ${{ steps.gate.outputs.checkpoint }}
        run: |
          mkdir -p data/state/scheduler /tmp/ssave
          gh run download -n leaguelab-scheduler-state -D /tmp/ssave || true
          python - <<'PY'
          import json,os
          from datetime import datetime
          from pathlib import Path
          today=datetime.now().astimezone().date().isoformat();ms=list(Path("/tmp/ssave").rglob("scheduler_state.json"));st={"date":today,"processed":[]}
          if ms:
              x=json.loads(ms[0].read_text())
              if x.get("date")==today:st=x
          key="{}@{}".format(os.environ["KICKOFF"],os.environ["CHECKPOINT"]);p=set(st.get("processed") or []);p.add(key)
          Path("data/state/scheduler/scheduler_state.json").write_text(json.dumps({"date":today,"processed":sorted(p)},indent=2))
          print("Processed:",key)
          PY
      - name: Upload scheduler state
        if: steps.proceed.outputs.run == 'true' && steps.gate.outputs.mode == 'live' && success()
        uses: actions/upload-artifact@v4
        with:
          name: leaguelab-scheduler-state
          path: data/state/scheduler/scheduler_state.json
          retention-days: 14
          overwrite: true
