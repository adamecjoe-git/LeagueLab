name: LeagueLab Daily NFL Plan
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Plan date YYYY-MM-DD (blank = today Central)"
        required: false
        default: ""
  schedule:
    - cron: "5 12 * 1,9-12 *"
    - cron: "5 13 * 1,9-12 *"
env:
  TZ: America/Chicago
permissions:
  contents: read
concurrency:
  group: leaguelab-daily-nfl-plan
  cancel-in-progress: false
jobs:
  build-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Gate to 7 AM Central
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=America/Chicago date +%H)" = "07" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Outside 7 AM Central; successful no-op."
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.8"
      - name: Restore config
        if: steps.gate.outputs.run == 'true'
        env:
          MANAGERS_JSON: ${{ secrets.LEAGUELAB_MANAGERS_JSON }}
          NOTIFICATIONS_JSON: ${{ secrets.LEAGUELAB_NOTIFICATIONS_JSON }}
        run: |
          mkdir -p data/config
          printf '%s' "$MANAGERS_JSON" > data/config/managers.json
          printf '%s' "$NOTIFICATIONS_JSON" > data/config/notifications.json
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Build plan
        if: steps.gate.outputs.run == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          D="${REQUESTED_DATE:-$(TZ=America/Chicago date +%F)}"
          mkdir -p data/state/daily_alert_plan
          python -m leaguelab.dynamic_alert_scheduler --date "$D" --json > data/state/daily_alert_plan/plan.json
          cat data/state/daily_alert_plan/plan.json
      - name: Save plan
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: leaguelab-daily-alert-plan
          path: data/state/daily_alert_plan/plan.json
          retention-days: 7
          overwrite: true
