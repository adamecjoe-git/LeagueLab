name: LeagueLab Test

on:
  workflow_dispatch:

jobs:
  yahoo-auth-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Decrypt Yahoo storage state
        env:
          YAHOO_STORAGE_PASSPHRASE: ${{ secrets.YAHOO_STORAGE_PASSPHRASE }}
        run: |
          printf '%s' "$YAHOO_STORAGE_PASSPHRASE" > yahoo-passphrase.txt

          openssl enc -d -aes-256-cbc \
            -pbkdf2 \
            -iter 200000 \
            -in yahoo-storage-state.json.enc \
            -out .yahoo-storage-state.json \
            -pass file:yahoo-passphrase.txt

          rm yahoo-passphrase.txt

      - name: Test LeagueLab import
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -c "import leaguelab; print('LeagueLab import successful')"

      - name: Test Yahoo authentication
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -c "
          from leaguelab.yahoo.client import YahooFantasyClient
          with YahooFantasyClient() as yahoo:
              profile = yahoo.get_profile()
              print('YAHOO AUTH SUCCESS' if profile else 'YAHOO AUTH FAILED')
          "